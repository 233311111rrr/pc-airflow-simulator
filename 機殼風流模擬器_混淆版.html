<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>機殼風流模擬器</title>
<style>
:root{--bg:#f3f5fa;--fg:#0f172a;--mut:#64748b;--card:#fff;--bd:#e2e8f0;--ac:#4f46e5;--acf:#fff;--sh:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--fg:#e6eaf6;--mut:#8f99b3;--card:#141b30;--bd:#25304f;--ac:#818cf8;--acf:#0b1020;--sh:0 1px 2px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0b1020;--fg:#e6eaf6;--mut:#8f99b3;--card:#141b30;--bd:#25304f;--ac:#818cf8;--acf:#0b1020;--sh:0 1px 2px rgba(0,0,0,.4)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding:8px 10px 6px;border-bottom:1px solid var(--bd);box-shadow:var(--sh)}
canvas{display:block;margin:0 auto;border-radius:14px;background:#0b0f16;touch-action:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
button,select,input{font:inherit;color:var(--fg)}
button{flex:none;border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
button.p,.tabs button.on{background:var(--ac);color:var(--acf);border-color:var(--ac)}
select,input[type=number],input[type=text]{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:7px 9px;min-width:0}
#stats{font-size:12px;color:var(--mut);padding:2px}#stats b{color:var(--fg)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 10px 4px;max-width:900px;margin:0 auto;scrollbar-width:none}
#settings{max-width:900px;margin:0 auto;padding:4px 10px 60px}.pn[hidden]{display:none}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin:8px 0;box-shadow:var(--sh)}
label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--mut)}
label:has(>input[type=checkbox]){flex-direction:row;align-items:center;gap:6px;font-size:13px;color:var(--fg)}
input[type=number]{width:78px}input[type=range]{accent-color:var(--ac);width:110px}input[type=checkbox]{width:18px;height:18px;accent-color:var(--ac)}
.row button[data-del]{margin-left:auto;border-radius:10px;color:#e11d48}
.add{width:100%;border-style:dashed;border-radius:14px;padding:10px;color:var(--ac)}
h4{margin:16px 2px 0;font-size:13px;color:var(--mut)}.hint{font-size:12px;color:var(--mut);margin:6px 2px}.rd{font-weight:700;font-variant-numeric:tabular-nums;margin-left:4px;min-width:56px}
@media (pointer:coarse){select,input[type=number],input[type=text],button{font-size:16px;min-height:38px}input[type=checkbox]{min-height:0}}
@media (max-width:420px){input[type=number]{width:68px}}
</style></head><body>
<div id="top"><div id="stage"><canvas id="cv"></canvas></div>
<div class="chips"><button id="pp" class="p">⏸ 暫停</button><button id="rs">↺ 重置</button><button data-p="pos">正壓</button><button data-p="neg">負壓</button><button data-p="bal">平衡</button><button data-p="aio">水冷範例</button><select data-g="view" data-t="s"><option value="T">溫度</option><option value="V">風速</option></select></div>
<div id="stats"></div></div>
<nav class="tabs"><button data-tab="env" class="on">機殼</button><button data-tab="parts">CPU/GPU</button><button data-tab="fan">風扇</button><button data-tab="rad">水排/開孔</button><button data-tab="th">溫度計</button></nav>
<main id="settings">
<section class="pn" id="p-env"><div class="row"><label>深度(前後) cm<input type="number" data-g="W" value="45"></label><label>高度 cm<input type="number" data-g="H" value="45"></label><label>厚度(側板間) cm<input type="number" data-g="D" value="22"></label></div>
<div class="row"><label>側板<select data-g="panel" data-t="s"><option value="glass">玻璃側透</option><option value="solid">實心鋼板</option><option value="mesh">網孔側板</option></select></label><label><input type="checkbox" data-g="psu">底部電源罩</label></div>
<div class="row"><label>室溫 °C<input type="number" data-g="Ta" value="25"></label><label>進風濾網堵塞 %<input type="number" data-g="clog" value="0"></label></div></section>
<section class="pn" id="p-parts" hidden><div class="row"><label>CPU 最高 W<input type="number" data-g="cpu" value="125"></label><label>GPU 最高 W<input type="number" data-g="gpu" value="250"></label></div><div id="cps"></div>
<p class="hint">可直接在畫面上用手指/滑鼠拖曳 CPU、GPU 移動位置,也可改下方數值。型號資料庫:✓=已上網核對(顯卡:瓦數+尺寸;CPU:最大功耗);✓W=只核對瓦數;無標示=典型值。風扇口徑/風量為估算,非公版卡尺寸請手動修正。</p></section>
<section class="pn" id="p-fan" hidden><div id="fans"></div><button id="af" class="add">＋新增風扇</button></section>
<section class="pn" id="p-rad" hidden><h4>水冷排</h4><div id="rads"></div><button id="ar" class="add">＋新增水排</button><h4>被動開孔</h4><div id="vents"></div><button id="av" class="add">＋新增開孔</button>
<p class="hint">水排貼著機殼內側,請在同一側加風扇並對準位置。</p></section>
<section class="pn" id="p-th" hidden><div id="ths"></div><button id="at" class="add">＋新增溫度計</button><p class="hint">溫度計數量不限,可在畫面上拖曳,或輸入位置百分比。讀數為該點周圍空氣溫度。</p></section>
</main>
